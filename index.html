<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="技术笔记 —— 记录技术、踩坑与思考。纯 HTML/CSS/JS 构建的静态博客。" />
  <title>首页 · 技术笔记</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- 社交分享预览 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="技术笔记" />
  <meta property="og:title" content="技术笔记" />
  <meta property="og:description" content="记录技术、踩坑与思考。" />
  <meta property="og:image" content="https://lsgeel.github.io/lsgclaudetest/assets/og-cover.png" />
  <meta property="og:url" content="https://lsgeel.github.io/lsgclaudetest/" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- 提前设置主题,避免刷新闪烁 -->
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container" id="main">
    <section class="hero">
      <h1><span class="prompt">$</span> <span id="hero-title">技术笔记</span></h1>
      <p class="tagline">记录技术、踩坑与思考</p>
    </section>

    <div id="tag-filter" class="tag-filter"></div>
    <div id="post-list" class="post-list"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
