<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="写文章" />
  <title>写文章 · 技术笔记</title>

  <!-- 提前设置主题,避免刷新闪烁 -->
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container editor-page">
    <h1>写文章</h1>
    <p class="sub">在左侧写 Markdown,右侧实时预览。写完后下载 .md 文件,并复制配置片段粘贴到 js/config.js。</p>

    <div class="field-grid">
      <div class="field">
        <label for="f-title">标题 *</label>
        <input id="f-title" type="text" placeholder="文章标题" />
      </div>
      <div class="field">
        <label for="f-id">文件名 / id *</label>
        <input id="f-id" type="text" placeholder="hello-world" />
        <span class="hint">用于 URL 和 .md 文件名,建议用英文小写 + 连字符</span>
      </div>
      <div class="field">
        <label for="f-date">发布日期</label>
        <input id="f-date" type="date" />
      </div>
      <div class="field">
        <label for="f-tags">标签</label>
        <input id="f-tags" type="text" placeholder="随笔, 技术" />
        <span class="hint">用逗号 / 空格分隔,如:随笔, 技术</span>
      </div>
      <div class="field full">
        <label for="f-desc">摘要</label>
        <input id="f-desc" type="text" placeholder="一句话简介,显示在列表卡片上(可选)" />
      </div>
      <div class="field full">
        <label>强调色(列表左侧竖条)</label>
        <div class="color-swatches" id="color-swatches"></div>
      </div>
    </div>

    <div class="editor-grid">
      <div class="editor-pane">
        <div class="pane-title"><span>正文(Markdown)</span><span id="char-count">0 字</span></div>
        <textarea id="f-content" placeholder="在这里写正文,支持 Markdown 语法…"></textarea>
      </div>
      <div class="editor-pane">
        <div class="pane-title"><span>实时预览</span></div>
        <div class="preview-pane" id="preview"></div>
      </div>
    </div>

    <div class="editor-actions">
      <button class="btn btn-primary" id="btn-download">下载 .md 文件</button>
      <button class="btn btn-secondary" id="btn-copy-config">复制配置片段</button>
      <button class="btn btn-ghost" id="btn-copy-body">复制正文</button>
      <button class="btn btn-ghost" id="btn-clear">清空</button>
    </div>

    <div class="snippet-box">
      <h3>配置片段(下载 .md 后,把它粘贴到 js/config.js 的 posts 数组里)</h3>
      <pre id="snippet"><code>{ /* 填写标题后这里会自动生成 */ }</code></pre>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
