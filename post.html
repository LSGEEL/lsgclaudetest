<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="文章详情" />
  <title>文章 · 技术笔记</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- 社交分享预览(标题/描述由 post.js 按文章内容动态更新) -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="技术笔记" />
  <meta property="og:title" content="技术笔记" />
  <meta property="og:description" content="记录技术、踩坑与思考。" />
  <meta property="og:image" content="https://lsgeel.github.io/lsgclaudetest/assets/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- 提前设置主题,避免刷新闪烁 -->
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />

  <!-- 代码高亮主题(深色,与代码块深色背景一致) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container" id="main">
    <article id="article">
      <div class="article-header">
        <h1 id="post-title">加载中…</h1>
        <div class="post-meta" id="post-meta"></div>
        <div class="post-tags" id="post-tags"></div>
      </div>
      <div class="article-content" id="post-content"></div>
      <div class="article-footer">
        <a href="index.html">← 返回首页</a>
        <a id="back-top" href="#">回到顶部 ↑</a>
      </div>
    </article>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- Markdown 解析 + 代码高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
